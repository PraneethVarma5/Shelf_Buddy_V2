<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Shelf Buddy</title>
    <style>
         body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #13182e, #1f2a4d);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            width: 420px;
            max-width: 90%;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            text-align: center;
        }

        .auth-container h2 {
            margin-bottom: 30px;
            color: #13182e;
            font-size: 22px;
        }

        .auth-container input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            transition: 0.2s ease;
            box-sizing: border-box;
        }

        .auth-container input:focus {
            border-color: #3ba55d;
            outline: none;
            box-shadow: 0 0 5px rgba(59,165,93,0.3);
        }

        .forgot-password-link {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 16px;
        }

        .forgot-password-link a {
            font-size: 14px;
            text-decoration: none;
            color: #13182e;
            font-weight: 500;
            transition: 0.2s ease;
        }

        .forgot-password-link a:hover {
            color: #3ba55d;
        }

        .auth-container button {
            width: 100%;
            padding: 14px;
            background: #13182e;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .auth-container button:hover {
            background: #3ba55d;
        }

        .auth-links-row {
            margin-top: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 14px;
        }

        .auth-links-row a {
            text-decoration: none;
            color: #13182e;
            font-weight: 500;
            transition: 0.2s ease;
        }

        .auth-links-row a:hover {
            color: #3ba55d;
        }

        .auth-links-row span {
            color: #999;
            font-weight: 400;
        }

        .auth-error {
            background: #fdeaea;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 25px;
                width: 90%;
            }

            .auth-links-row {
                flex-direction: column;
                gap: 10px;
            }

            .auth-links-row span {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>Forgot Password</h2>
        <p class="auth-subtitle">Enter your registered email to receive a password reset link</p>

        <form method="POST">
            <input type="email" name="email" placeholder="Email" required>
            <button type="submit">Send Reset Link</button>
        </form>

        <div class="auth-links-row">
            <a href="{{ url_for('login') }}">Back to Login</a>
            <span>|</span>
            <a href="{{ url_for('register') }}">Create Account</a>
            <span>|</span>
            <a href="{{ url_for('first_page') }}">Back to Home</a>
        </div>
    </div>

</body>
</html>
